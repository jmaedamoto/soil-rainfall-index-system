# 土壌雨量指数計算システム - production 用 Apache mod_wsgi 設定
# client の dist 配下は /var/www/html/dosya に別途配置する前提

WSGIDaemonProcess soilrsi-production processes=1 threads=5 inactivity-timeout=900 request-timeout=900 socket-timeout=900 graceful-timeout=30 python-path=/var/www/app/soil-rainfall-index-system/server:/var/www/app/soil-rainfall-index-system/server/src
WSGIScriptAlias /dosya/api /var/www/app/soil-rainfall-index-system/server/wsgi.py process-group=soilrsi-production application-group=%{GLOBAL}
Timeout 900

<Directory /var/www/app/soil-rainfall-index-system/server>
    SetEnv SOIL_RAINFALL_ROUTE_PROFILE production
    SetEnv CACHE_DIR /var/cache/nyapp/dosya
    SetEnv CACHE_MEMORY_MAX_RESULTS 2
    Require all granted
</Directory>

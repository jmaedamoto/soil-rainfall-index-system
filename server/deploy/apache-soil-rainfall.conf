# 土壌雨量指数計算システム - Apache VirtualHost 設定
# Rocky Linux 9.7 + mod_wsgi 用
#
# 配置場所: /etc/httpd/conf.d/soil-rainfall.conf
#
# 事前準備:
#   1. mod_wsgi インストール: pip3 install mod_wsgi
#   2. mod_wsgi モジュールパス確認: mod_wsgi-express module-config
#   3. 下記の LoadModule 行を実際のパスに置き換える

# mod_wsgi モジュール読み込み（パスは環境に応じて変更）
# LoadModule wsgi_module /usr/local/lib64/python3.9/site-packages/mod_wsgi/server/mod_wsgi-py39.cpython-39-x86_64-linux-gnu.so
# WSGIPythonHome /var/www/soil-rainfall/venv

<VirtualHost *:80>
    ServerName soil-rainfall.example.com
    ServerAdmin admin@example.com

    # ドキュメントルート（静的ファイル用）
    DocumentRoot /var/www/soil-rainfall/server

    # WSGI設定
    WSGIDaemonProcess soil-rainfall \
        python-home=/var/www/soil-rainfall/venv \
        python-path=/var/www/soil-rainfall/server:/var/www/soil-rainfall/server/src \
        processes=2 \
        threads=15 \
        inactivity-timeout=900 \
        request-timeout=900 \
        socket-timeout=900 \
        display-name=%{GROUP}

    WSGIProcessGroup soil-rainfall
    WSGIScriptAlias / /var/www/soil-rainfall/server/wsgi.py

    # WSGIスクリプトへのアクセス許可
    <Directory /var/www/soil-rainfall/server>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # 静的ファイル（必要に応じて）
    # Alias /static /var/www/soil-rainfall/server/static
    # <Directory /var/www/soil-rainfall/server/static>
    #     Require all granted
    # </Directory>

    # ログ設定
    ErrorLog /var/log/httpd/soil-rainfall-error.log
    CustomLog /var/log/httpd/soil-rainfall-access.log combined
    LogLevel warn

    # タイムアウト設定（GRIB2ダウンロード考慮）
    TimeOut 900
</VirtualHost>

# HTTPS設定（本番環境推奨）
# <VirtualHost *:443>
#     ServerName soil-rainfall.example.com
#
#     SSLEngine on
#     SSLCertificateFile /etc/pki/tls/certs/your-cert.crt
#     SSLCertificateKeyFile /etc/pki/tls/private/your-key.key
#
#     # 上記と同じWSGI設定を記述
# </VirtualHost>

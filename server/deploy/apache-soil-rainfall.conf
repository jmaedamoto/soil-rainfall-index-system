# 土壌雨量指数計算システム - Apache mod_wsgi 設定
# client の dist 配下は /var/www/html/dosya に別途配置する前提

WSGIDaemonProcess soilrsi processes=1 threads=5 inactivity-timeout=600 request-timeout=600 socket-timeout=600 graceful-timeout=30 python-path=/var/www/app/soil-rainfall-index-system/server:/var/www/app/soil-rainfall-index-system/server/src
WSGIProcessGroup soilrsi
WSGIApplicationGroup %{GLOBAL}
WSGIScriptAlias /dosya/api /var/www/app/soil-rainfall-index-system/server/wsgi.py
Timeout 600

<Directory /var/www/app/soil-rainfall-index-system/server>
    SetEnv CACHE_DIR /var/cache/myapp/dosya
    Require all granted
</Directory>

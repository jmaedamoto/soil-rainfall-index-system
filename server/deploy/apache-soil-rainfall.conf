# 土壌雨量指数計算システム - staging 用 Apache mod_wsgi 設定
# client の dist 配下は /var/www/html/staging/dosya に別途配置する前提

WSGIDaemonProcess soilrsi-staging processes=1 threads=5 inactivity-timeout=600 request-timeout=600 socket-timeout=600 graceful-timeout=30 python-path=/var/www/app/staging/soil-rainfall-index-system/server:/var/www/app/staging/soil-rainfall-index-system/server/src
WSGIProcessGroup soilrsi-staging
WSGIApplicationGroup %{GLOBAL}
WSGIScriptAlias /staging/dosya/api /var/www/app/staging/soil-rainfall-index-system/server/wsgi.py
Timeout 600

# access log に処理時間(μs/秒)と接続終了状態を出し、長時間リクエストの切断要因を追跡する
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D %T %X" timed_combined
CustomLog logs/staging_dosya_access_log timed_combined

<Directory /var/www/app/staging/soil-rainfall-index-system/server>
    SetEnv CACHE_DIR /var/cache/myapp/staging/dosya
    Require all granted
</Directory>
